name: Bookmark Manager CI

on:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
    
      - name: List project files
        run: ls -la
      
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
        
      - name: Check Node.js and npm versions
        run: |
          node --version
          npm --version